<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Carrera</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans p-6 flex flex-col items-center justify-center min-h-screen">
    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 p-6 rounded-2xl shadow-xl text-center space-y-6">
        <div>
            <h1 class="text-lg font-bold text-white mb-1">Estado de tu Servicio</h1>
            <p id="infoId" class="text-xs text-zinc-500 font-mono"></p>
        </div>

        <!-- Estado Actual -->
        <div id="estadoActualBox" class="p-4 bg-zinc-950 border border-zinc-800 rounded-xl">
            <span class="text-xs text-zinc-400 block mb-1">ESTADO ACTUAL</span>
            <span id="textoEstado" class="text-xl font-bold text-amber-400 animate-pulse">Cargando...</span>
        </div>

        <!-- Token de Seguridad para el Cliente -->
        <div class="bg-zinc-950 border border-zinc-800 p-4 rounded-xl space-y-1">
            <span class="text-xs text-zinc-400 block">TOKEN DE SEGURIDAD (Dicta este código al abordar)</span>
            <span id="lblToken" class="text-2xl font-bold text-amber-400 tracking-wider font-mono">----</span>
        </div>

        <!-- Detalles del Servicio -->
        <div class="text-left space-y-3 text-sm bg-zinc-950 p-4 rounded-xl border border-zinc-900">
            <div><span class="text-zinc-500 text-xs block">ORIGEN:</span> <span id="lblOrigen" class="text-zinc-200">--</span></div>
            <div><span class="text-zinc-500 text-xs block">DESTINO:</span> <span id="lblDestino" class="text-zinc-200">--</span></div>
            <div><span class="text-zinc-500 text-xs block">CONDUCTOR:</span> <span id="lblConductor" class="text-zinc-200">--</span></div>
        </div>

        <p class="text-xs text-zinc-500">Esta página se actualiza automáticamente.</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7yzs-VFf63rgzw-wbdAFIQpYI4INdReUL_F8ooGbYC8ZDD1REf67truM57oW9-q6W/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const carreraId = urlParams.get('id');

        document.getElementById('infoId').innerText = "ID: " + (carreraId || "No especificado");

        async function consultarEstado() {
            if(!carreraId) return;
            try {
                let res = await fetch(`${SCRIPT_URL}?action=obtenerCarrera&id=${carreraId}`);
                let c = await res.json();
                
                if(c.error) {
                    document.getElementById('textoEstado').innerText = "Carrera no encontrada";
                    document.getElementById('textoEstado').className = "text-xl font-bold text-rose-500";
                    return;
                }

                document.getElementById('textoEstado').innerText = c.Estado;
                document.getElementById('lblOrigen').innerText = c.Origen;
                document.getElementById('lblDestino').innerText = c.Destino;
                document.getElementById('lblConductor').innerText = c.Conductor || "Asignando...";
                
                // Muestra el token de seguridad devuelto por la hoja
                document.getElementById('lblToken').innerText = c.Token || c.token || "----";

                if(c.Estado === "Finalizar") {
                    document.getElementById('textoEstado').className = "text-xl font-bold text-emerald-400";
                    document.getElementById('textoEstado').classList.remove('animate-pulse');
                }
            } catch(e) { 
                console.error("Error consultando estado", e); 
            }
        }

        if(carreraId) {
            setInterval(consultarEstado, 5000);
            consultarEstado();
        } else {
            document.getElementById('textoEstado').innerText = "ID no válido";
            document.getElementById('textoEstado').className = "text-xl font-bold text-rose-500";
        }
    </script>
</body>
</html>
