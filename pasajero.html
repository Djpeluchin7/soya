<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo Pasajero - GPS Realtime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #0d0d0d; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #161616; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282828; }
        .container { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; max-width: 600px; width: 100%; margin: 0 auto; justify-content: center; }
        .card { background: #181818; border: 1px solid #282828; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        h3 { font-size: 1.2rem; margin-bottom: 16px; }
        .input-group { margin-bottom: 14px; }
        .input-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; }
        .input-group input { width: 100%; background: #222; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 8px; outline: none; font-size: 0.95rem; }
        .btn-primary { background-color: #276ef1; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn-primary:active { background-color: #1d55c7; }
        
        .estado-box { text-align: center; padding: 20px 0; }
        .estado-titulo { font-size: 1.1rem; font-weight: bold; color: #276ef1; margin-bottom: 8px; text-transform: uppercase; }
        .eta-texto { font-size: 0.9rem; color: #4ade80; background: #112c1d; border: 1px solid #166534; padding: 10px; border-radius: 8px; margin-top: 10px; }
        
        .chat-box { background: #121212; border: 1px solid #333; border-radius: 8px; height: 130px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .msg { padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; max-width: 80%; }
        .msg.pasajero { background: #276ef1; align-self: flex-end; color: #fff; }
        .msg.conductor { background: #282828; align-self: flex-start; }
        .chat-input-row { display: flex; gap: 8px; }
        .chat-input-row input { flex: 1; background: #282828; border: 1px solid #383838; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        .chat-input-row button { width: 80px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        .gps-alert { background: #3b211f; border: 1px solid #991b1b; padding: 12px; border-radius: 8px; font-size: 0.85rem; color: #f87171; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <header>
        <h2>Primo <span style="font-weight: 300; color: #a0a0a0;">Passenger</span></h2>
        <button id="btnAudio" style="background:#222; color:#fff; border:1px solid #444; padding:6px 12px; border-radius:6px; font-size:0.8rem; cursor:pointer;" onclick="activarAudio()">🔊 Audio</button>
    </header>

    <div class="container">
        <!-- VISTA: PEDIR VIAJE -->
        <div class="card" id="seccionPedido">
            <h3>Solicitar Viaje</h3>
            <div id="gpsAlert" class="gps-alert">⚠️ Es obligatorio activar la geolocalización para solicitar un viaje.</div>
            <div class="input-group">
                <label>Tu Nombre / Alias</label>
                <input type="text" id="txtCliente" value="Pasajero 1">
            </div>
            <div class="input-group">
                <label>Origen (Obtenido por GPS)</label>
                <input type="text" id="txtOrigen" readonly placeholder="Obteniendo coordenadas GPS...">
            </div>
            <div class="input-group">
                <label>Destino al que viajas</label>
                <input type="text" id="txtDestino" placeholder="Ej. Centro Comercial, Calle 50...">
            </div>
            <button class="btn-primary" onclick="pedirViaje()">Pedir Viaje Ahora</button>
        </div>

        <!-- VISTA: ESTADO DEL VIAJE Y CHAT -->
        <div class="card" id="seccionEstado" style="display:none;">
            <div class="estado-box">
                <div class="estado-titulo" id="lblEstadoViaje">Buscando conductor...</div>
                <p id="lblConductorInfo" style="font-size: 0.9rem; color: #ccc; margin-bottom: 5px;"></p>
                <div class="eta-texto" id="lblEta" style="display:none;">Calculando tiempo de espera...</div>
            </div>

            <div id="panelChat" style="display:none;">
                <h4 style="font-size:0.85rem; margin-bottom:6px; color:#aaa;">Chat con Conductor</h4>
                <div class="chat-box" id="chatBox"></div>
                <div class="chat-input-row">
                    <input type="text" id="txtMensaje" placeholder="Escribe al conductor...">
                    <button onclick="enviarMensajePasajero()">Enviar</button>
                </div>
            </div>

            <button id="btnCancelar" class="btn-primary" style="background-color: #380d11; color: #ff6b6b; border: 1px solid #701a23; margin-top: 15px;" onclick="cancelarViajePasajero()">Cancelar Viaje</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCsZh4ghoaOWj0OZpzcgJX4oK_2heZ1AYA",
  authDomain: "ride-chat-c3b39.firebaseapp.com",
  projectId: "ride-chat-c3b39",
  storageBucket: "ride-chat-c3b39.firebasestorage.app",
  messagingSenderId: "967517116276",
  appId: "1:967517116276:web:b84ddd46f4127b2e80fe21"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let miUbicacion = { lat: null, lng: null };
        let viajeIdActual = null;
        let unsubscribeViaje = null;
        let audioCtx = null;
        let cantidadMensajesAnterior = 0;

        window.activarAudio = function() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            alert("Audio activado correctamente.");
        }

        function reproducirSonidoChat() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(750, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } catch(e) {}
        }

        // Obligar a obtener ubicación al iniciar la app
        window.onload = function() {
            let guardado = localStorage.getItem("pasajero_viaje_activo");
            if (guardado) {
                let obj = JSON.parse(guardado);
                viajeIdActual = obj.viajeId;
                document.getElementById("seccionPedido").style.display = "none";
                document.getElementById("seccionEstado").style.display = "block";
                escucharEstadoViaje();
            } else {
                forzarGPS();
            }
        };

        function forzarGPS() {
            if (!navigator.geolocation) {
                document.getElementById("gpsAlert").style.display = "block";
                document.getElementById("gpsAlert").innerText = "Tu navegador no soporta geolocalización.";
                return;
            }
            document.getElementById("txtOrigen").value = "Obteniendo ubicación GPS precisa...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    miUbicacion.lat = pos.coords.latitude;
                    miUbicacion.lng = pos.coords.longitude;
                    document.getElementById("txtOrigen").value = `Lat: ${miUbicacion.lat.toFixed(4)}, Lng: ${miUbicacion.lng.toFixed(4)} (GPS Activo)`;
                    document.getElementById("gpsAlert").style.display = "none";
                },
                (err) => {
                    document.getElementById("gpsAlert").style.display = "block";
                    document.getElementById("txtOrigen").value = "Error al obtener ubicación";
                    alert("Es obligatorio permitir el acceso a la ubicación para pedir un viaje.");
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        window.pedirViaje = async function() {
            let cliente = document.getElementById("txtCliente").value.trim();
            let destino = document.getElementById("txtDestino").value.trim();

            if (!miUbicacion.lat || !miUbicacion.lng) {
                alert("No se han detectado tus coordenadas GPS. Por favor espera o recarga la página.");
                forzarGPS();
                return;
            }
            if (!destino) {
                alert("Por favor ingresa un destino.");
                return;
            }

            try {
                const docRef = await addDoc(collection(db, "viajes"), {
                    cliente: cliente,
                    origen: `Lat: ${miUbicacion.lat.toFixed(4)}, Lng: ${miUbicacion.lng.toFixed(4)}`,
                    origen_lat: miUbicacion.lat,
                    origen_lng: miUbicacion.lng,
                    destino: destino,
                    estado: "PENDIENTE",
                    conductor: "",
                    conductor_lat: null,
                    conductor_lng: null,
                    chat: [],
                    timestamp: new Date()
                });

                viajeIdActual = docRef.id;
                localStorage.setItem("pasajero_viaje_activo", JSON.stringify({ viajeId: viajeIdActual }));

                document.getElementById("seccionPedido").style.display = "none";
                document.getElementById("seccionEstado").style.display = "block";
                escucharEstadoViaje();
            } catch (e) {
                alert("Error al solicitar viaje: " + e.message);
            }
        }

        function escucharEstadoViaje() {
            const ref = doc(db, "viajes", viajeIdActual);
            unsubscribeViaje = onSnapshot(ref, (snap) => {
                if (!snap.exists()) return;
                let data = snap.data();

                document.getElementById("lblEstadoViaje").innerText = "Estado: " + data.estado;
                
                let infoConductor = document.getElementById("lblConductorInfo");
                let etaBox = document.getElementById("lblEta");
                let panelChat = document.getElementById("panelChat");

                if (data.estado !== "PENDIENTE") {
                    infoConductor.innerText = `Conductor asignado: ${data.conductor || "En camino"}`;
                    panelChat.style.display = "block";

                    // Cálculo de distancia y ETA si el conductor comparte coordenadas
                    if (data.conductor_lat && data.conductor_lng && data.origen_lat && data.origen_lng) {
                        let km = calcularDistanciaKm(data.conductor_lat, data.conductor_lng, data.origen_lat, data.origen_lng);
                        let minutos = Math.max(1, Math.round((km / 30) * 60)); // Asumiendo 30 km/h en ciudad
                        
                        etaBox.style.display = "block";
                        if (km < 0.1) {
                            etaBox.innerText = "¡El conductor está llegando a tu ubicación!";
                        } else {
                            etaBox.innerText = `El conductor va en camino. Su tiempo de espera es aprox. ${minutos} min (${km.toFixed(1)} km).`;
                        }
                    }
                } else {
                    infoConductor.innerText = "Buscando conductor disponible en la zona...";
                    etaBox.style.display = "none";
                }

                // Chat en tiempo real
                let chatBox = document.getElementById("chatBox");
                let mensajes = data.chat || [];
                if (mensajes.length > cantidadMensajesAnterior && cantidadMensajesAnterior !== 0) {
                    let ultimo = mensajes[mensajes.length - 1];
                    if (ultimo && ultimo.remitente === 'conductor') reproducirSonidoChat();
                }
                cantidadMensajesAnterior = mensajes.length;

                chatBox.innerHTML = mensajes.map(m => `<div class="msg ${m.remitente === 'pasajero' ? 'pasajero' : 'conductor'}"><b>${m.remitente}:</b> ${m.texto}</div>`).join('');
                chatBox.scrollTop = chatBox.scrollHeight;

                if (data.estado === "FINALIZADA" || data.estado === "CANCELADA") {
                    if (unsubscribeViaje) unsubscribeViaje();
                    alert("El viaje ha finalizado o fue cancelado.");
                    localStorage.removeItem("pasajero_viaje_activo");
                    location.reload();
                }
            });
        }

        function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
        }

        window.enviarMensajePasajero = async function() {
            let txt = document.getElementById("txtMensaje").value.trim();
            if(!txt || !viajeIdActual) return;
            try {
                await updateDoc(doc(db, "viajes", viajeIdActual), {
                    chat: arrayUnion({ remitente: "pasajero", texto: txt, timestamp: new Date() })
                });
                document.getElementById("txtMensaje").value = "";
            } catch(e) {}
        }

        window.cancelarViajePasajero = async function() {
            if(!confirm("¿Deseas cancelar el viaje?")) return;
            try {
                await updateDoc(doc(db, "viajes", viajeIdActual), { estado: "CANCELADA" });
                localStorage.removeItem("pasajero_viaje_activo");
                location.reload();
            } catch(e) {}
        }
    </script>
</body>
</html>
