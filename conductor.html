<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primo Driver - GPS Realtime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #121212; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #282828; }
        .driver-profile { display: flex; gap: 10px; align-items: center; }
        .driver-profile input { background: #282828; border: 1px solid #383838; color: #fff; padding: 6px 10px; border-radius: 8px; width: 90px; outline: none; font-size: 0.85rem; }
        
        .container { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; max-width: 600px; width: 100%; margin: 0 auto; justify-content: center; }
        .card { background: #181818; border: 1px solid #282828; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        h3 { font-size: 1.2rem; margin-bottom: 16px; }
        
        .chat-box { background: #121212; border: 1px solid #333; border-radius: 8px; height: 130px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        .msg { padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; max-width: 80%; }
        .msg.conductor { background: #276ef1; align-self: flex-end; color: #fff; }
        .msg.pasajero { background: #282828; align-self: flex-start; }
        .chat-input-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .chat-input-row input { flex: 1; background: #282828; border: 1px solid #383838; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        .chat-input-row button { width: 80px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        
        .trip-card { background: #181818; border: 1px solid #282828; border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn-accept { background-color: #276ef1; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background-color: #276ef1; color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        
        .map-buttons-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-map { flex: 1; background-color: #1f3a24; color: #4ade80; border: 1px solid #166534; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; font-size: 0.85rem; display: inline-block; }
        .btn-map.destination { background-color: #3b211f; color: #f87171; border: 1px solid #991b1b; }

        .btn-cancel-trip { background-color: #380d11; color: #ff6b6b; border: 1px solid #701a23; width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .estado-actual { font-size: 0.9rem; color: #276ef1; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; }
        .gps-status { font-size: 0.75rem; color: #4ade80; background: #112c1d; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <h2>Primo <span style="font-weight: 300; color: #a0a0a0;">Driver</span></h2>
        <div class="driver-profile">
            <input type="text" id="nombreConductor" value="DRV-01">
            <button id="btnVolverRadar" style="display:none; background:#1f3a24; color:#4ade80; border:1px solid #166534; padding:6px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="limpiarYVolverAlRadar()">Nuevo Viaje</button>
            <button style="background:#222; color:#fff; border:1px solid #444; padding:6px 10px; border-radius:6px; font-size:0.75rem; cursor:pointer;" onclick="activarAudioDriver()">🔊 Audio</button>
        </div>
    </header>

    <div class="container">
        <!-- RADAR DE VIAJES -->
        <div id="seccionRadar">
            <h3>Radar de Solicitudes</h3>
            <div id="listaViajes"><div style="text-align:center; color:#666; padding:30px;">Buscando solicitudes cercanas...</div></div>
        </div>

        <!-- VIAJE ACTIVO -->
        <div class="card" id="viajeActivo" style="display:none;">
            <h3>Carrera en Curso</h3>
            <div class="gps-status" id="lblGpsStatus">📡 GPS Transmitiendo Ubicación...</div>
            <div class="estado-actual" id="lblEstadoActual">Estado: Aceptada</div>
            <p style="margin-bottom:8px;">Pasajero: <strong id="actCliente"></strong></p>
            <p style="margin-bottom:5px; font-size:0.9rem;"><strong>Origen:</strong> <span id="actOrigen"></span></p>
            <p style="margin-bottom:15px; font-size:0.9rem;"><strong>Destino:</strong> <span id="actDestino"></span></p>

            <div class="map-buttons-row">
                <a id="linkOrigenMap" href="#" target="_blank" class="btn-map">📍 Abrir Origen</a>
                <a id="linkDestinoMap" href="#" target="_blank" class="btn-map destination">🏁 Ir a Destino</a>
            </div>

            <h4 style="font-size:0.85rem; margin-bottom:6px; color:#aaa;">Chat con Pasajero</h4>
            <div class="chat-box" id="chatBox"></div>
            <div class="chat-input-row" id="chatInputRow">
                <input type="text" id="txtMensaje" placeholder="Escribe al pasajero...">
                <button onclick="enviarMensajeDriver()">Enviar</button>
            </div>

            <button class="btn-primary" id="btnAvanzarEstado" onclick="avanzarSiguienteEstado()">Avanzar Estado</button>
            <button class="btn-cancel-trip" id="btnCancelarViaje" onclick="cancelarViajeConductor()">Cancelar Viaje</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, updateDoc, onSnapshot, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
           apiKey: "AIzaSyCsZh4ghoaOWj0OZpzcgJX4oK_2heZ1AYA",
  authDomain: "ride-chat-c3b39.firebaseapp.com",
  projectId: "ride-chat-c3b39",
  storageBucket: "ride-chat-c3b39.firebasestorage.app",
  messagingSenderId: "967517116276",
  appId: "1:967517116276:web:b84ddd46f4127b2e80fe21"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const estadosSecuencia = ["PENDIENTE", "ACEPTADA", "EN_CAMINO", "YA_ESTAMOS_AFUERA", "FINALIZADA"];
        let viajeEnCurso = null;
        let unsubscribeRadar = null;
        let unsubscribeViajeActivo = null;
        let watchIdGPS = null;
        let audioCtx = null;
        let cantidadViajesAnterior = 0;
        let cantidadMensajesAnterior = 0;

        window.activarAudioDriver = function() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            alert("Alertas de audio activadas.");
        }

        function reproducirAlerta(tipo) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(tipo === 'carrera' ? 900 : 600, now);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } catch(e) {}
        }

        window.onload = function() {
            let guardado = localStorage.getItem("conductor_viaje_activo");
            if(guardado) {
                viajeEnCurso = JSON.parse(guardado);
                mostrarViajeActivoUI();
                iniciarTransmisionGPS();
            } else {
                iniciarRadarRealtime();
            }
        };

        function iniciarRadarRealtime() {
            const q = query(collection(db, "viajes"), where("estado", "==", "PENDIENTE"));
            unsubscribeRadar = onSnapshot(q, (snapshot) => {
                let lista = [];
                snapshot.forEach(docSnap => lista.push({ id: docSnap.id, ...docSnap.data() }));

                if (lista.length > cantidadViajesAnterior && cantidadViajesAnterior !== 0) {
                    reproducirAlerta('carrera');
                }
                cantidadViajesAnterior = lista.length;

                let html = "";
                if(lista.length === 0) {
                    document.getElementById("listaViajes").innerHTML = '<div style="text-align:center; color:#666; padding:30px;">No hay viajes pendientes en el radar...</div>';
                    return;
                }
                lista.forEach(v => {
                    let jsonStr = encodeURIComponent(JSON.stringify(v));
                    html += `<div class="trip-card">
                        <div><p style="margin-bottom:4px;"><b>Pasajero:</b> ${v.cliente}</p><p style="font-size:0.85rem; color:#aaa;"><b>Origen:</b> ${v.origen}</p><p style="font-size:0.85rem; color:#aaa;"><b>Destino:</b> ${v.destino}</p></div>
                        <button class="btn-accept" onclick='tomarCarrera("${jsonStr}")'>Aceptar</button>
                    </div>`;
                });
                document.getElementById("listaViajes").innerHTML = html;
            });
        }

        window.tomarCarrera = async function(jsonStr) {
            let v = JSON.parse(decodeURIComponent(jsonStr));
            let conductorNombre = document.getElementById("nombreConductor").value;

            if (!navigator.geolocation) {
                alert("Tu dispositivo no soporta GPS.");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    let ref = doc(db, "viajes", v.id);
                    let snap = await getDoc(ref);
                    if (!snap.exists() || snap.data().estado !== "PENDIENTE") {
                        alert("Lo siento, esta carrera ya fue tomada por otro conductor.");
                        return;
                    }

                    await updateDoc(ref, {
                        estado: "ACEPTADA",
                        conductor: conductorNombre,
                        conductor_lat: pos.coords.latitude,
                        conductor_lng: pos.coords.longitude
                    });

                    if(unsubscribeRadar) unsubscribeRadar();

                    viajeEnCurso = { id: v.id, cliente: v.cliente, origen: v.origen, destino: v.destino, estado: "ACEPTADA" };
                    localStorage.setItem("conductor_viaje_activo", JSON.stringify(viajeEnCurso));
                    
                    location.reload();
                } catch(e) {
                    alert("Error al tomar carrera: " + e.message);
                }
            }, (err) => {
                alert("Es obligatorio tener el GPS activo para aceptar carreras.");
            }, { enableHighAccuracy: true });
        }

        function iniciarTransmisionGPS() {
            if (!navigator.geolocation) return;
            watchIdGPS = navigator.geolocation.watchPosition(async (pos) => {
                if (!viajeEnCurso) return;
                try {
                    await updateDoc(doc(db, "viajes", viajeEnCurso.id), {
                        conductor_lat: pos.coords.latitude,
                        conductor_lng: pos.coords.longitude
                    });
                } catch(e) {}
            }, (err) => {
                document.getElementById("lblGpsStatus").innerText = "⚠️ Error de GPS";
                document.getElementById("lblGpsStatus").style.background = "#3b211f";
                document.getElementById("lblGpsStatus").style.color = "#f87171";
            }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        }

        function mostrarViajeActivoUI() {
            document.getElementById("seccionRadar").style.display = "none";
            document.getElementById("viajeActivo").style.display = "block";
            document.getElementById("actCliente").innerText = viajeEnCurso.cliente;
            document.getElementById("actOrigen").innerText = viajeEnCurso.origen;
            document.getElementById("actDestino").innerText = viajeEnCurso.destino;

            document.getElementById("linkOrigenMap").href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(viajeEnCurso.origen)}`;
            document.getElementById("linkDestinoMap").href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(viajeEnCurso.destino)}`;

            unsubscribeViajeActivo = onSnapshot(doc(db, "viajes", viajeEnCurso.id), (snap) => {
                if(!snap.exists()) return;
                let data = snap.data();
                viajeEnCurso.estado = data.estado;
                document.getElementById("lblEstadoActual").innerText = "Estado: " + data.estado;

                let chatBox = document.getElementById("chatBox");
                let mensajes = data.chat || [];
                if (mensajes.length > cantidadMensajesAnterior && cantidadMensajesAnterior !== 0) {
                    let ultimo = mensajes[mensajes.length - 1];
                    if (ultimo && ultimo.remitente === 'pasajero') reproducirAlerta('chat');
                }
                cantidadMensajesAnterior = mensajes.length;

                chatBox.innerHTML = mensajes.map(m => `<div class="msg ${m.remitente === 'conductor' ? 'conductor' : 'pasajero'}"><b>${m.remitente}:</b> ${m.texto}</div>`).join('');
                chatBox.scrollTop = chatBox.scrollHeight;

                if(data.estado === "FINALIZADA" || data.estado === "CANCELADA") {
                    if(unsubscribeViajeActivo) unsubscribeViajeActivo();
                    if(watchIdGPS) navigator.geolocation.clearWatch(watchIdGPS);
                    document.getElementById("btnAvanzarEstado").style.display = "none";
                    document.getElementById("btnCancelarViaje").style.display = "none";
                    document.getElementById("chatInputRow").style.display = "none";
                    document.getElementById("lblGpsStatus").style.display = "none";
                    document.getElementById("btnVolverRadar").style.display = "inline-block";
                }
            });
        }

        window.enviarMensajeDriver = async function() {
            let txt = document.getElementById("txtMensaje").value.trim();
            if(!txt || !viajeEnCurso) return;
            try {
                await updateDoc(doc(db, "viajes", viajeEnCurso.id), {
                    chat: arrayUnion({ remitente: "conductor", texto: txt, timestamp: new Date() })
                });
                document.getElementById("txtMensaje").value = "";
            } catch(e) {}
        }

        window.avanzarSiguienteEstado = async function() {
            let idx = estadosSecuencia.indexOf(viajeEnCurso.estado);
            if (idx < estadosSecuencia.length - 1) {
                let nuevoEstado = estadosSecuencia[idx + 1];
                try {
                    await updateDoc(doc(db, "viajes", viajeEnCurso.id), { estado: nuevoEstado });
                    viajeEnCurso.estado = nuevoEstado;
                    localStorage.setItem("conductor_viaje_activo", JSON.stringify(viajeEnCurso));
                } catch(e) {}
            }
        }

        window.cancelarViajeConductor = async function() {
            if(!confirm("¿Cancelar viaje?")) return;
            try {
                await updateDoc(doc(db, "viajes", viajeEnCurso.id), { estado: "CANCELADA" });
                if(watchIdGPS) navigator.geolocation.clearWatch(watchIdGPS);
                localStorage.removeItem("conductor_viaje_activo");
                location.reload();
            } catch(e) {}
        }

        window.limpiarYVolverAlRadar = function() {
            if(watchIdGPS) navigator.geolocation.clearWatch(watchIdGPS);
            localStorage.removeItem("conductor_viaje_activo");
            location.reload();
        }
    </script>
</body>
</html>
